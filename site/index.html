<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="theme-color" content="#2ecc71">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<!--
  A speaker gets SPEAK_SECONDS (5:00, green, yellow at 2:00 left, red at 1:00
  left), then a grace countdown of GRACE_SECONDS (2:00, "Wrap up", a slow
  breathing red), then the cutoff flows into a "Questions" count-up with no end.

  The state lives in a Durable Object (src/worker.js) reached over a WebSocket
  at /ws, so every open copy of the page shows the same thing and any of them
  can control it. Open it through the Worker (npx wrangler dev locally), not as
  a file.

  Controls
    Tap anywhere, Space or Enter   start, pause, resume.
    Questions button or Q          jump to the questions count-up, from anywhere.
    Reset button or R              back to the start.
    Two-finger tap, N or Right     set the speaking clock: presets 5:00, 2:02, 1:02,
                                   0:02 and Cutoff 0:02, or type m:ss.
    Mute button                    silence this device only.
    Hide button or H               hide the buttons on this device; a two-finger
                                   tap brings them back (and opens the picker otherwise).
  On a phone the controls are a button row at the bottom.
  The timing constants are at the top of the script.
-->
<style>
:root {
  --green: #2ecc71;
  --yellow: #f5c518;
  --red: #e5473a;
  --red-deep: #b3271c;
  --blue: #1e3a8a;
  --ink: #111111;
  --bg: var(--green);
  --fade: 1.5s;
  --slot-w: 0.62em;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  position: relative;
  background-color: var(--bg);
  color: var(--ink);
  font-family: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--fade) ease, color var(--fade) ease;
  cursor: pointer;
}
body[data-color="green"]  { --bg: var(--green); }
body[data-color="yellow"] { --bg: var(--yellow); }
body[data-color="red"]    { --bg: var(--red); }
body[data-color="wrap"]   { --bg: var(--red); }
/* Wrap up: the red breathes and the digits beat gently while running. */
body[data-color="wrap"][data-phase="running"] { animation: breathe 2.5s ease-in-out infinite; }
body[data-color="wrap"][data-phase="running"] #clock { animation: heartbeat 2.5s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { background-color: var(--red); }
  50% { background-color: var(--red-deep); }
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
body[data-color="blue"]   { --bg: var(--blue); --ink: #f8fafc; }

#stage {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#label {
  min-height: 1.3em;
  margin-bottom: 1vh;
  font-size: max(2.8vw, 16px);
  font-weight: 700;
  letter-spacing: 0.04em;
  opacity: 0.75;
}
#clock {
  display: flex;
  align-items: center;
  font-size: min(32vw, 78vh);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
  white-space: nowrap;
  will-change: transform;
}
.slot {
  position: relative;
  display: inline-block;
  width: var(--slot-w);
  height: 1em;
  overflow: hidden;
  transition: width 0.4s ease, opacity 0.4s ease;
}
.slot.off { width: 0; opacity: 0; }
.digit {
  position: absolute;
  inset: 0;
  text-align: center;
  line-height: 1;
}
.colon {
  display: inline-block;
  width: 0.34em;
  text-align: center;
  position: relative;
  top: -0.08em;
}
body[data-phase="paused"] #clock { animation: dim 2.4s ease-in-out infinite; }
@keyframes dim {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.85; }
}

#hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(9vh + env(safe-area-inset-bottom));
  text-align: center;
  font-size: max(2.4vw, 15px);
  font-weight: 600;
  letter-spacing: 0.02em;
  opacity: 0.65;
  transition: opacity 0.4s ease;
}
body[data-phase="running"] #hint { opacity: 0; }

#buttons {
  position: absolute;
  top: calc(3vh + env(safe-area-inset-top));
  right: calc(3vw + env(safe-area-inset-right));
  display: flex;
  gap: 1vw;
}
#buttons button {
  font: inherit;
  font-size: max(1.9vw, 14px);
  font-weight: 700;
  color: inherit;
  background: color-mix(in srgb, currentColor 8%, transparent);
  border: 0.14em solid color-mix(in srgb, currentColor 50%, transparent);
  border-radius: 999px;
  padding: 0.55em 1.3em;
  cursor: pointer;
  transition: opacity 0.4s ease, transform 0.15s ease, color var(--fade) ease,
    border-color var(--fade) ease, background-color var(--fade) ease;
}
#buttons button:active { transform: scale(0.95); }
#buttons button[aria-pressed="true"] { background: color-mix(in srgb, currentColor 30%, transparent); }
body.hide-buttons #buttons { opacity: 0; pointer-events: none; }
.narrow { display: none; }
body[data-phase="running"] #reset,
body.fresh #reset,
body[data-mode="questions"] #questions { opacity: 0; pointer-events: none; }

#link {
  position: absolute;
  left: calc(2vw + env(safe-area-inset-left));
  bottom: calc(3vh + env(safe-area-inset-bottom));
  font-size: max(1.6vw, 13px);
  font-weight: 600;
  opacity: 0.7;
}
#link.on { display: none; }

#bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 1.4vh;
  background: color-mix(in srgb, currentColor 12%, transparent);
  transition: opacity 0.4s ease;
}
#fill {
  height: 100%;
  width: 100%;
  background: color-mix(in srgb, currentColor 55%, transparent);
  transform-origin: left center;
  transform: scaleX(var(--p, 0));
}
body[data-mode="questions"] #bar { opacity: 0; }

#flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}

#picker {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(17, 17, 17, 0.45);
  cursor: default;
}
#picker.open { display: flex; }
#picker form {
  width: min(72vw, 760px);
  padding: 3vw;
  border-radius: 1.6vw;
  background: #fff;
  color: #111111;
  box-shadow: 0 2vh 6vh rgba(0, 0, 0, 0.3);
  font-size: max(2vw, 15px);
}
#picker h2 {
  font-size: max(2.4vw, 19px);
  font-weight: 800;
  margin-bottom: 1.6vw;
}
#presets {
  display: flex;
  flex-wrap: wrap;
  gap: max(1vw, 8px);
  margin-bottom: max(2vw, 14px);
}
#picker button {
  font: inherit;
  font-weight: 700;
  color: #111111;
  background: rgba(17, 17, 17, 0.06);
  border: 0.12em solid rgba(17, 17, 17, 0.5);
  border-radius: 999px;
  padding: 0.55em 1.2em;
  min-height: 44px;
  cursor: pointer;
}
#picker button:active { transform: scale(0.96); }
#presets button {
  font-size: max(2.6vw, 18px);
  font-variant-numeric: tabular-nums;
}
#picker .row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: max(1vw, 8px);
}
#pickerInput {
  font: inherit;
  font-size: max(2.6vw, 20px);
  font-variant-numeric: tabular-nums;
  width: 7ch;
  padding: 0.35em 0.5em;
  text-align: center;
  color: #111111;
  background: #fff;
  border: 0.12em solid rgba(17, 17, 17, 0.5);
  border-radius: 0.5em;
  -webkit-user-select: text;
  user-select: text;
}
#pickerInput:focus { outline: 0.2em solid var(--green); }
#pickerHelp {
  margin-top: max(1.2vw, 10px);
  font-size: max(1.7vw, 13px);
  opacity: 0.7;
}
#pickerError {
  margin-top: 0.6vw;
  font-size: max(1.7vw, 13px);
  color: var(--red);
  min-height: 1.2em;
}

#rotate { display: none; }
@media (orientation: portrait) and (min-width: 761px) {
  #rotate {
    display: block;
    position: absolute;
    top: calc(6vh + env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 3vw;
    font-weight: 600;
    opacity: 0.6;
  }
}

/* Phones: the clock fills the width and the controls become a row at the bottom. */
@media (max-width: 760px) {
  #stage { bottom: 22vh; }
  #clock { font-size: min(26vw, 34vh); }
  #hint { bottom: calc(23vh + env(safe-area-inset-bottom)); }
  #buttons {
    top: auto;
    right: auto;
    left: 0;
    bottom: calc(4vh + env(safe-area-inset-bottom));
    width: 100%;
    padding: 0 4vw;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  #buttons button { font-size: 16px; padding: 0.7em 1em; min-height: 44px; }
  .narrow { display: inline-block; }
  body[data-phase="running"] #reset,
  body.fresh #reset,
  body[data-mode="questions"] #questions { display: none; }
  body.hide-buttons #buttons { display: none; }
  #link { bottom: calc(14vh + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; }
  #picker form { width: 92vw; padding: 5vw; border-radius: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  body, .slot, #hint, #buttons button, #bar { transition: none; }
  body[data-phase="paused"] #clock { animation: none; opacity: 0.6; }
  body[data-color="wrap"][data-phase="running"],
  body[data-color="wrap"][data-phase="running"] #clock { animation: none; }
}
</style>
</head>
<body data-phase="idle" data-mode="speaking" data-color="green" class="fresh">
<main id="stage">
  <p id="label"></p>
  <div id="clock"><span class="slot"></span><span class="slot"></span><span class="colon">:</span><span class="slot"></span><span class="slot"></span></div>
</main>
<p id="hint">Tap to start</p>
<div id="buttons">
  <button id="toggle" type="button" class="narrow">Start</button>
  <button id="questions" type="button">Questions</button>
  <button id="reset" type="button">Reset</button>
  <button id="settime" type="button" class="narrow">Set time</button>
  <button id="mute" type="button" aria-pressed="false">Mute</button>
  <button id="hide" type="button">Hide</button>
</div>
<p id="link">Connecting</p>
<div id="bar"><div id="fill"></div></div>
<div id="flash"></div>
<p id="rotate">Rotate to landscape</p>
<div id="picker">
  <form id="pickerForm">
    <h2>Set the speaking clock</h2>
    <div id="presets"></div>
    <div class="row">
      <input id="pickerInput" type="text" inputmode="numeric" autocomplete="off" placeholder="m:ss" aria-label="Minutes and seconds">
      <button type="submit">Set</button>
      <button type="button" id="pickerCancel">Cancel</button>
    </div>
    <p id="pickerHelp">7:30, 730 or 7 all work. Tap outside to close.</p>
    <p id="pickerError"></p>
  </form>
</div>
<script>
(() => {
  'use strict';

  // Timing. Edit these and redeploy. The server stores only timestamps, so
  // these live here alone.
  const SPEAK_SECONDS = 5 * 60;       // what the speaker is told
  const GRACE_SECONDS = 2 * 60;       // "Wrap up" countdown after that; the cutoff ends it
  const YELLOW_AT_SECONDS = 2 * 60;   // remaining on the speaking clock when it turns yellow
  const RED_AT_SECONDS = 1 * 60;      // remaining on the speaking clock when it turns red
  // Time picker presets sit this many seconds before each event.
  const PRESET_MARGIN_SECONDS = 2;

  const SPEAK_MS = SPEAK_SECONDS * 1000;
  const CUTOFF_MS = (SPEAK_SECONDS + GRACE_SECONDS) * 1000;
  const MAX_SECONDS = 99 * 60 + 59;

  const HINTS = {
    idle: 'Tap to start',
    running: 'Tap to pause',
    paused: 'Paused. Tap to resume.',
  };
  const LABELS = { speaking: '', grace: 'Wrap up', questions: 'Questions' };
  const TOGGLE_TEXT = { idle: 'Start', running: 'Pause', paused: 'Resume' };

  const body = document.body;
  const clock = document.getElementById('clock');
  const slots = Array.from(clock.querySelectorAll('.slot'));
  const label = document.getElementById('label');
  const hint = document.getElementById('hint');
  const fill = document.getElementById('fill');
  const flash = document.getElementById('flash');
  const link = document.getElementById('link');
  const toggleBtn = document.getElementById('toggle');
  const resetBtn = document.getElementById('reset');
  const questionsBtn = document.getElementById('questions');
  const setTimeBtn = document.getElementById('settime');
  const muteBtn = document.getElementById('mute');
  const hideBtn = document.getElementById('hide');
  const picker = document.getElementById('picker');
  const pickerForm = document.getElementById('pickerForm');
  const pickerInput = document.getElementById('pickerInput');
  const pickerError = document.getElementById('pickerError');
  const presets = document.getElementById('presets');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Shared state, mirrored from the server. Every device renders from the same
  // timestamps, so they agree to within the clock offset measured below.
  let state = { phase: 'idle', startedAt: null, elapsedMs: 0, questionsAt: null, barStartMs: 0 };
  let clockOffset = 0;  // server clock minus ours, in ms
  let rafId = 0;
  let shownDigits = [];
  let shownColor = null;
  let wakeLock = null;

  const now = () => performance.now();
  const serverNow = () => Date.now() + clockOffset;
  const elapsed = () => (state.phase === 'running' ? serverNow() - state.startedAt : state.elapsedMs);
  const questionsStart = () => (state.questionsAt === null ? CUTOFF_MS : state.questionsAt);

  function modeFor(e) {
    if (e >= questionsStart()) return 'questions';
    if (e >= SPEAK_MS) return 'grace';
    return 'speaking';
  }

  function colorFor(e, mode) {
    if (mode === 'questions') return 'blue';
    if (mode === 'grace') return 'wrap';  // red too, but its own key so the grace start is a crossing
    const left = SPEAK_MS - e;
    if (left <= RED_AT_SECONDS * 1000) return 'red';
    if (left <= YELLOW_AT_SECONDS * 1000) return 'yellow';
    return 'green';
  }

  // Display

  function setDigit(slot, d, animate) {
    const old = slot.lastElementChild;
    const next = document.createElement('span');
    next.className = 'digit';
    next.textContent = d;
    slot.appendChild(next);
    if (!old) return;
    if (!animate || reduceMotion) { old.remove(); return; }
    const opts = { duration: 320, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards' };
    next.animate([{ transform: 'translateY(-100%)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], opts);
    const out = old.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(100%)', opacity: 0 }], opts);
    out.onfinish = () => old.remove();
  }

  // What a color change does: a live crossing sounds and pulses, a jump only
  // pulses, a reset or a fresh connection does neither.
  const LIVE = { sound: true, pulse: true };
  const JUMP = { sound: false, pulse: true };
  const QUIET = { sound: false, pulse: false };

  function render(e, opts = LIVE) {
    const mode = modeFor(e);
    let secs;
    if (mode === 'questions') secs = Math.floor((e - questionsStart()) / 1000);
    else if (mode === 'grace') secs = Math.ceil((CUTOFF_MS - e) / 1000);
    else secs = Math.ceil((SPEAK_MS - e) / 1000);
    secs = Math.max(0, Math.min(MAX_SECONDS, secs));
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    const digits = [Math.floor(m / 10), m % 10, Math.floor(s / 10), s % 10];
    const first = shownDigits.length === 0;
    digits.forEach((d, i) => {
      if (shownDigits[i] === d) return;
      if (i === 0 && d === 0) return;  // the leading slot collapses instead of rolling to 0
      setDigit(slots[i], d, !first);
    });
    slots[0].classList.toggle('off', digits[0] === 0);
    shownDigits = digits;

    body.dataset.mode = mode;
    label.textContent = LABELS[mode];

    const p = (e - state.barStartMs) / (CUTOFF_MS - state.barStartMs);
    fill.style.setProperty('--p', Math.max(0, Math.min(1, p)).toFixed(4));

    const color = colorFor(e, mode);
    if (color !== shownColor) {
      const crossed = shownColor !== null;
      shownColor = color;
      body.dataset.color = color;
      if (crossed && opts.pulse) pulse();
      if (crossed && opts.sound) {
        if (color === 'yellow' || color === 'red') ding();
        else if (color === 'wrap') chime();
        else if (color === 'blue') longChime();
      }
    }
  }

  function pulse() {
    if (reduceMotion) return;
    flash.animate(
      [{ opacity: 0 }, { opacity: 0.35, offset: 0.15 }, { opacity: 0 }],
      { duration: 800, easing: 'ease-out' },
    );
    clock.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.06)', offset: 0.3 }, { transform: 'scale(1)' }],
      { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' },
    );
  }

  function bounce() {
    if (reduceMotion) return;
    clock.animate(
      [{ transform: 'scale(0.96)' }, { transform: 'scale(1)' }],
      { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1.2)' },
    );
  }

  function reflectPhase() {
    body.dataset.phase = state.phase;
    hint.textContent = HINTS[state.phase];
    toggleBtn.textContent = TOGGLE_TEXT[state.phase];
    body.classList.toggle('fresh', state.phase === 'idle' && state.elapsedMs === 0 && state.questionsAt === null);
  }

  function tick() {
    if (state.phase !== 'running') return;
    render(elapsed());
    rafId = requestAnimationFrame(tick);
  }

  // A broadcast from the server: adopt the state and render it. The cause
  // decides whether a color change may sound.
  function applyState(msg) {
    state = msg.state;
    const cause = msg.cause;
    const opts = cause === 'set' || cause === 'questions' ? JUMP
      : cause === 'start' || cause === 'pause' ? LIVE
      : QUIET;
    reflectPhase();
    if (cause === 'start' || cause === 'pause') bounce();
    cancelAnimationFrame(rafId);
    render(elapsed(), opts);
    if (state.phase === 'running') {
      requestWakeLock();
      rafId = requestAnimationFrame(tick);
    } else {
      releaseWakeLock();
    }
  }

  // Actions. Each one goes to the server; the display changes when the
  // broadcast comes back. The bounce is immediate feedback for the tap.

  function toggle() {
    unlockAudio();
    bounce();
    send({ type: state.phase === 'running' ? 'pause' : 'start' });
  }

  function reset() {
    closePicker();
    send({ type: 'reset' });
  }

  // Jump to the questions count-up from anywhere, without the cutoff chime.
  function questions() {
    closePicker();
    unlockAudio();
    if (modeFor(elapsed()) === 'questions') return;
    send({ type: 'questions' });
  }

  // Move the clock to a point in the run, without any sound.
  function applyElapsed(e) {
    closePicker();
    send({ type: 'set', elapsedMs: e });
  }

  // The link to the shared state

  let socket = null;
  let retryMs = 500;
  let retryTimer = 0;
  let bestRtt = Infinity;
  let bestRttAt = 0;

  function connect() {
    clearTimeout(retryTimer);
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${scheme}://${location.host}/ws`);
    socket = ws;
    ws.onopen = () => {
      retryMs = 500;
      link.classList.add('on');
      ping();
    };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (_) { return; }
      if (msg.type === 'pong') takeOffset(msg);
      else if (msg.type === 'state') {
        if (bestRtt === Infinity) clockOffset = msg.now - Date.now();  // rough, until the first pong
        applyState(msg);
      }
    };
    ws.onclose = () => {
      if (socket !== ws) return;
      socket = null;
      link.textContent = 'Reconnecting';
      link.classList.remove('on');
      retryTimer = setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 10000);
    };
    ws.onerror = () => ws.close();
  }

  function send(msg) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(msg));
    else connect();
  }

  function ping() {
    send({ type: 'ping', t: Date.now() });
  }

  // Keep the lowest-round-trip sample; refresh it every couple of minutes.
  function takeOffset(msg) {
    const rtt = Date.now() - msg.t;
    const sample = msg.now + rtt / 2 - Date.now();
    if (rtt <= bestRtt || Date.now() - bestRttAt > 120000) {
      bestRtt = rtt;
      bestRttAt = Date.now();
      clockOffset = sample;
    }
  }

  setInterval(ping, 15000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    connect();
    ping();
    if (state.phase !== 'running') return;
    if (!wakeLock) requestWakeLock();
    cancelAnimationFrame(rafId);
    tick();
  });

  // Time picker (two-finger tap, N, Right arrow, or the Set time button)

  function formatTime(sec) {
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }

  // "7:30" or "7.30" -> 7:30; "730" / "1000" -> 7:30 / 10:00; "7" -> 7:00.
  function parseTime(text) {
    const t = text.trim();
    let m = /^(\d{1,3})[:.](\d{1,2})$/.exec(t);
    if (m) return (Number(m[1]) * 60 + Number(m[2])) * 1000;
    m = /^(\d{1,4})$/.exec(t);
    if (!m) return null;
    if (t.length <= 2) return Number(t) * 60 * 1000;
    return (Number(t.slice(0, -2)) * 60 + Number(t.slice(-2))) * 1000;
  }

  const PRESETS = [
    { text: formatTime(SPEAK_SECONDS), elapsed: 0 },
    { text: formatTime(YELLOW_AT_SECONDS + PRESET_MARGIN_SECONDS),
      elapsed: (SPEAK_SECONDS - YELLOW_AT_SECONDS - PRESET_MARGIN_SECONDS) * 1000 },
    { text: formatTime(RED_AT_SECONDS + PRESET_MARGIN_SECONDS),
      elapsed: (SPEAK_SECONDS - RED_AT_SECONDS - PRESET_MARGIN_SECONDS) * 1000 },
    { text: formatTime(PRESET_MARGIN_SECONDS), elapsed: (SPEAK_SECONDS - PRESET_MARGIN_SECONDS) * 1000 },
    { text: `Cutoff ${formatTime(PRESET_MARGIN_SECONDS)}`,
      elapsed: (SPEAK_SECONDS + GRACE_SECONDS - PRESET_MARGIN_SECONDS) * 1000 },
  ];

  function pickerOpen() {
    return picker.classList.contains('open');
  }

  function openPicker(focusInput) {
    pickerError.textContent = '';
    pickerInput.value = '';
    picker.classList.add('open');
    if (focusInput) pickerInput.focus();
  }

  function closePicker() {
    pickerInput.blur();
    picker.classList.remove('open');
  }

  PRESETS.forEach(({ text, elapsed: e }) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.addEventListener('click', () => applyElapsed(e));
    presets.appendChild(b);
  });

  pickerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const ms = parseTime(pickerInput.value);
    if (ms === null || ms <= 0) {
      pickerError.textContent = 'Use m:ss like 7:30, digits like 730, or minutes like 7.';
      return;
    }
    const remaining = Math.max(1000, Math.min(MAX_SECONDS * 1000, ms));
    applyElapsed(SPEAK_MS - remaining);
  });
  document.getElementById('pickerCancel').addEventListener('click', closePicker);
  picker.addEventListener('click', (e) => { if (e.target === picker) closePicker(); });

  // Sound. Three tones are rendered once into WAVs and played through one
  // <audio> element: a soft ding at yellow and at red, a chime when the grace
  // starts, and a longer chime at the cutoff. iOS lets a media element that a
  // tap started be replayed later without a gesture, and media playback
  // ignores silent mode, which Web Audio output does not. Mute is per device.

  const CHIME_NOTES = [523.25, 659.25, 783.99, 1046.5];  // C5 E5 G5 C6
  const CHIME_LEAD_S = 0.25;  // silence before the first note, so the unlock play+pause stays inaudible
  const DING = { freq: 880, at: 0, dur: 0.9, gain: 0.3 };  // A5, half the chime's level
  let bell = null;
  let dingUrl = null;
  let chimeUrl = null;
  let longChimeUrl = null;
  let bellReady = false;
  let muted = false;
  try { muted = localStorage.getItem('timer.muted') === '1'; } catch (_) { /* private mode */ }

  // notes: [{ freq, at, dur, gain }], seconds after the lead-in silence.
  function renderTone(notes, leadS) {
    const rate = 22050;
    const end = Math.max(...notes.map((x) => x.at + x.dur)) + 0.2;
    const n = Math.ceil((leadS + end) * rate);
    const samples = new Float32Array(n);
    notes.forEach(({ freq, at, dur, gain }) => {
      const s0 = Math.floor((leadS + at) * rate);
      const s1 = Math.min(n, Math.floor((leadS + at + dur) * rate));
      for (let s = s0; s < s1; s++) {
        const t = (s - s0) / rate;
        const attack = Math.min(1, t / 0.02);
        const decay = Math.pow(0.0002, t / dur);
        samples[s] += gain * attack * decay * Math.sin(2 * Math.PI * freq * t);
      }
    });
    const view = new DataView(new ArrayBuffer(44 + n * 2));
    const tag = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    tag(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); tag(8, 'WAVE');
    tag(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    tag(36, 'data'); view.setUint32(40, n * 2, true);
    for (let s = 0; s < n; s++) view.setInt16(44 + s * 2, Math.max(-1, Math.min(1, samples[s])) * 32767, true);
    return URL.createObjectURL(new Blob([view.buffer], { type: 'audio/wav' }));
  }

  // The four-note run, starting `offset` seconds in, with the last note held `lastDur`.
  function chimeRun(offset, lastDur) {
    const last = CHIME_NOTES.length - 1;
    return CHIME_NOTES.map((freq, i) => ({ freq, at: offset + i * 0.28, dur: i === last ? lastDur : 0.7, gain: 0.6 }));
  }

  function getBell() {
    if (!bell) {
      dingUrl = renderTone([DING], 0.05);
      chimeUrl = renderTone(chimeRun(0, 1.8), CHIME_LEAD_S);
      longChimeUrl = renderTone([...chimeRun(0, 1.0), ...chimeRun(1.5, 1.8)], CHIME_LEAD_S);
      bell = new Audio(chimeUrl);
      bell.preload = 'auto';
      bell.setAttribute('playsinline', '');
      bell.load();
    }
    return bell;
  }

  // Runs inside a tap: starts the element during the gesture and stops it
  // again inside the leading silence. From then on play() works any time.
  function unlockAudio() {
    const el = getBell();
    if (bellReady) return;
    const started = el.play();
    if (!started) return;
    started.then(() => {
      el.pause();
      el.currentTime = 0;
      bellReady = true;
    }).catch(() => {});
  }

  function playTone(url) {
    if (muted) return;
    const el = getBell();
    // Re-setting src before play() is the workaround for WebKit bug 295518:
    // home-screen apps on iOS 26.0/26.1 otherwise go silent after a relaunch.
    el.src = url;
    el.play().catch(() => {});
  }

  function ding() { playTone(dingUrl); }
  function chime() { playTone(chimeUrl); }
  function longChime() { playTone(longChimeUrl); }

  function reflectMute() {
    muteBtn.textContent = muted ? 'Unmute' : 'Mute';
    muteBtn.setAttribute('aria-pressed', String(muted));
  }

  // Keep the screen on while running

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (state.phase !== 'running') { lock.release().catch(() => {}); return; }
      wakeLock = lock;
      lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
    } catch (_) {
      wakeLock = null;
    }
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }

  // Hidden buttons, per device. A two-finger tap brings them back.

  let buttonsHidden = false;
  try { buttonsHidden = localStorage.getItem('timer.hideButtons') === '1'; } catch (_) { /* private mode */ }

  function setButtonsHidden(hidden) {
    buttonsHidden = hidden;
    body.classList.toggle('hide-buttons', hidden);
    try { localStorage.setItem('timer.hideButtons', hidden ? '1' : '0'); } catch (_) { /* private mode */ }
  }

  function twoFingerTap() {
    if (buttonsHidden) setButtonsHidden(false);
    else openPicker(false);
  }

  // Input: one finger toggles, two fingers bring the buttons back or open the picker.
  // Touch goes through touch events: iOS Safari drops pointer events once a
  // second finger lands, so a two-finger tap never completed through them.

  const TAP_MAX_MS = 800;
  const TAP_MAX_MOVE_PX = 24;
  const PASSTHROUGH = '#buttons, #picker';  // real buttons and the form get normal browser taps

  let touchFingers = 0;
  let touchStart = 0;
  let touchMoved = false;
  let touchIgnored = false;
  const touchOrigins = new Map();

  window.addEventListener('touchstart', (e) => {
    if (touchFingers === 0) {
      touchStart = now();
      touchMoved = false;
      touchIgnored = !!e.target.closest(PASSTHROUGH);
      touchOrigins.clear();
    }
    if (touchIgnored) return;
    e.preventDefault();
    for (const t of e.changedTouches) touchOrigins.set(t.identifier, { x: t.clientX, y: t.clientY });
    touchFingers = Math.max(touchFingers, e.touches.length);
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (touchIgnored) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const o = touchOrigins.get(t.identifier);
      if (o && Math.hypot(t.clientX - o.x, t.clientY - o.y) > TAP_MAX_MOVE_PX) touchMoved = true;
    }
  }, { passive: false });

  function endTouch(e, cancelled) {
    if (touchIgnored) {
      if (e.touches.length === 0) touchIgnored = false;
      return;
    }
    e.preventDefault();
    if (cancelled) touchMoved = true;
    if (e.touches.length > 0) return;
    const fingers = touchFingers;
    touchFingers = 0;
    if (touchMoved || now() - touchStart > TAP_MAX_MS) return;
    if (fingers >= 2) twoFingerTap();
    else toggle();
  }

  window.addEventListener('touchend', (e) => endTouch(e, false), { passive: false });
  window.addEventListener('touchcancel', (e) => endTouch(e, true), { passive: false });

  // Mouse and pen go through pointer events.

  const pointers = new Map();
  let gestureFingers = 0;
  let gestureStart = 0;
  let gestureMoved = false;

  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' || e.target.closest(PASSTHROUGH)) return;
    if (pointers.size === 0) {
      gestureFingers = 0;
      gestureStart = now();
      gestureMoved = false;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    gestureFingers = Math.max(gestureFingers, pointers.size);
  });

  window.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (p && Math.hypot(e.clientX - p.x, e.clientY - p.y) > TAP_MAX_MOVE_PX) gestureMoved = true;
  });

  function endGesture(e, cancelled) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (cancelled) gestureMoved = true;
    if (pointers.size > 0) return;
    if (gestureMoved || now() - gestureStart > TAP_MAX_MS) return;
    if (gestureFingers >= 2) twoFingerTap();
    else toggle();
  }

  window.addEventListener('pointerup', (e) => endGesture(e, false));
  window.addEventListener('pointercancel', (e) => endGesture(e, true));

  function onButton(btn, action) {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      btn.blur();
      action();
    });
  }
  onButton(toggleBtn, toggle);
  onButton(resetBtn, reset);
  onButton(questionsBtn, questions);
  onButton(setTimeBtn, () => { unlockAudio(); openPicker(false); });
  onButton(hideBtn, () => setButtonsHidden(true));
  onButton(muteBtn, () => {
    muted = !muted;
    try { localStorage.setItem('timer.muted', muted ? '1' : '0'); } catch (_) { /* private mode */ }
    reflectMute();
    unlockAudio();
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (pickerOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); closePicker(); }
      return;  // the form handles typing and Enter
    }
    const k = e.key.toLowerCase();
    if (k === 'arrowright' || k === 'n') { e.preventDefault(); openPicker(true); }
    else if (k === ' ' || k === 'enter') { e.preventDefault(); toggle(); }
    else if (k === 'r') reset();
    else if (k === 'q') questions();
    else if (k === 'h') setButtonsHidden(!buttonsHidden);
  });

  // No pinch zoom, no long-press menu.
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // iOS 17+: put the page on the media channel so silent mode does not mute it.
  if (navigator.audioSession) {
    try { navigator.audioSession.type = 'playback'; } catch (_) { /* older WebKit */ }
  }
  getBell();
  reflectMute();
  setButtonsHidden(buttonsHidden);
  reflectPhase();
  render(0, QUIET);
  connect();
})();
</script>
</body>
</html>
