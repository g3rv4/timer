<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="theme-color" content="#2ecc71">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<!--
  Controls
    Tap anywhere, Space or Enter   start, pause, resume. At 0:00 it resets.
    Reset button or R              back to 10:00.
    Two-finger tap, N or Right     set the time: presets 10:00, 5:02, 2:32, 0:02, or type m:ss.
  The timing constants are at the top of the script.
-->
<style>
:root {
  --green: #2ecc71;
  --yellow: #f5c518;
  --red: #e5473a;
  --red-deep: #b3271c;
  --ink: #111111;
  --bg: var(--green);
  --fade: 1.5s;
  --slot-w: 0.62em;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  position: relative;
  background-color: var(--bg);
  color: var(--ink);
  font-family: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--fade) ease;
  cursor: pointer;
}
body[data-color="green"]  { --bg: var(--green); }
body[data-color="yellow"] { --bg: var(--yellow); }
body[data-color="red"]    { --bg: var(--red); }
body[data-phase="done"] { animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { background-color: var(--red); }
  50% { background-color: var(--red-deep); }
}

#stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#clock {
  display: flex;
  align-items: center;
  font-size: min(32vw, 78vh);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
  white-space: nowrap;
  will-change: transform;
}
.slot {
  position: relative;
  display: inline-block;
  width: var(--slot-w);
  height: 1em;
  overflow: hidden;
  transition: width 0.4s ease, opacity 0.4s ease;
}
.slot.off { width: 0; opacity: 0; }
.digit {
  position: absolute;
  inset: 0;
  text-align: center;
  line-height: 1;
}
.colon {
  display: inline-block;
  width: 0.34em;
  text-align: center;
  position: relative;
  top: -0.08em;
}
body[data-phase="paused"] #clock { animation: dim 2.4s ease-in-out infinite; }
@keyframes dim {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.85; }
}
body[data-phase="done"] #clock { animation: heartbeat 1.4s ease-in-out infinite; }
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

#hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(9vh + env(safe-area-inset-bottom));
  text-align: center;
  font-size: 2.4vw;
  font-weight: 600;
  letter-spacing: 0.02em;
  opacity: 0.65;
  transition: opacity 0.4s ease;
}
body[data-phase="running"] #hint { opacity: 0; }

#reset {
  position: absolute;
  top: calc(3vh + env(safe-area-inset-top));
  right: calc(3vw + env(safe-area-inset-right));
  font: inherit;
  font-size: 1.9vw;
  font-weight: 700;
  color: var(--ink);
  background: rgba(17, 17, 17, 0.08);
  border: 0.14em solid rgba(17, 17, 17, 0.5);
  border-radius: 999px;
  padding: 0.55em 1.3em;
  cursor: pointer;
  transition: opacity 0.4s ease, transform 0.15s ease;
}
#reset:active { transform: scale(0.95); }
body[data-phase="running"] #reset,
body.fresh #reset { opacity: 0; pointer-events: none; }

#bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 1.4vh;
  background: rgba(17, 17, 17, 0.12);
}
#fill {
  height: 100%;
  width: 100%;
  background: rgba(17, 17, 17, 0.55);
  transform-origin: left center;
  transform: scaleX(var(--p, 0));
}

#flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}

#picker {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(17, 17, 17, 0.45);
  cursor: default;
}
#picker.open { display: flex; }
#picker form {
  width: min(72vw, 760px);
  padding: 3vw;
  border-radius: 1.6vw;
  background: #fff;
  color: var(--ink);
  box-shadow: 0 2vh 6vh rgba(0, 0, 0, 0.3);
  font-size: 2vw;
}
#picker h2 {
  font-size: 2.4vw;
  font-weight: 800;
  margin-bottom: 1.6vw;
}
#presets {
  display: flex;
  flex-wrap: wrap;
  gap: 1vw;
  margin-bottom: 2vw;
}
#picker button {
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: rgba(17, 17, 17, 0.06);
  border: 0.12em solid rgba(17, 17, 17, 0.5);
  border-radius: 999px;
  padding: 0.55em 1.2em;
  min-height: 44px;
  cursor: pointer;
}
#picker button:active { transform: scale(0.96); }
#presets button {
  font-size: 2.6vw;
  font-variant-numeric: tabular-nums;
}
#picker .row {
  display: flex;
  align-items: center;
  gap: 1vw;
}
#pickerInput {
  font: inherit;
  font-size: 2.6vw;
  font-variant-numeric: tabular-nums;
  width: 7ch;
  padding: 0.35em 0.5em;
  text-align: center;
  color: var(--ink);
  background: #fff;
  border: 0.12em solid rgba(17, 17, 17, 0.5);
  border-radius: 0.5em;
  -webkit-user-select: text;
  user-select: text;
}
#pickerInput:focus { outline: 0.2em solid var(--green); }
#pickerHelp {
  margin-top: 1.2vw;
  font-size: 1.7vw;
  opacity: 0.7;
}
#pickerError {
  margin-top: 0.6vw;
  font-size: 1.7vw;
  color: var(--red);
  min-height: 1.2em;
}

#rotate { display: none; }
@media (orientation: portrait) {
  #rotate {
    display: block;
    position: absolute;
    top: calc(6vh + env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 3vw;
    font-weight: 600;
    opacity: 0.6;
  }
}

@media (prefers-reduced-motion: reduce) {
  body, .slot, #hint, #reset { transition: none; }
  body[data-phase="done"],
  body[data-phase="paused"] #clock,
  body[data-phase="done"] #clock { animation: none; }
  body[data-phase="paused"] #clock { opacity: 0.6; }
}
</style>
</head>
<body data-phase="idle" class="fresh">
<main id="stage">
  <div id="clock"><span class="slot"></span><span class="slot"></span><span class="colon">:</span><span class="slot"></span><span class="slot"></span></div>
</main>
<p id="hint">Tap to start</p>
<button id="reset" type="button">Reset</button>
<div id="bar"><div id="fill"></div></div>
<div id="flash"></div>
<p id="rotate">Rotate to landscape</p>
<div id="picker">
  <form id="pickerForm">
    <h2>Set time</h2>
    <div id="presets"></div>
    <div class="row">
      <input id="pickerInput" type="text" inputmode="numeric" autocomplete="off" placeholder="m:ss" aria-label="Minutes and seconds">
      <button type="submit">Set</button>
      <button type="button" id="pickerCancel">Cancel</button>
    </div>
    <p id="pickerHelp">7:30, 730 or 7 all work. Tap outside to close.</p>
    <p id="pickerError"></p>
  </form>
</div>
<script>
(() => {
  'use strict';

  // Timing. Edit these and redeploy.
  const TOTAL_SECONDS = 10 * 60;
  const YELLOW_AT_SECONDS = 5 * 60;
  const RED_AT_SECONDS = 2 * 60 + 30;
  // Time picker presets sit this many seconds before each threshold.
  const PRESET_MARGIN_SECONDS = 2;

  const HINTS = {
    idle: 'Tap to start',
    running: 'Tap to pause',
    paused: 'Paused. Tap to resume.',
    done: "Time's up. Tap to reset.",
  };

  const body = document.body;
  const clock = document.getElementById('clock');
  const slots = Array.from(clock.querySelectorAll('.slot'));
  const hint = document.getElementById('hint');
  const fill = document.getElementById('fill');
  const flash = document.getElementById('flash');
  const resetBtn = document.getElementById('reset');
  const picker = document.getElementById('picker');
  const pickerForm = document.getElementById('pickerForm');
  const pickerInput = document.getElementById('pickerInput');
  const pickerError = document.getElementById('pickerError');
  const presets = document.getElementById('presets');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let phase = 'idle';                       // idle | running | paused | done
  let remainingMs = TOTAL_SECONDS * 1000;   // authoritative while not running
  let endAt = 0;                            // deadline while running
  let rafId = 0;
  let shownDigits = [];
  let shownColor = null;
  let wakeLock = null;
  let barTotalMs = TOTAL_SECONDS * 1000;  // grows when a time above TOTAL is picked

  const now = () => performance.now();
  const remaining = () => (phase === 'running' ? Math.max(0, endAt - now()) : remainingMs);

  function colorFor(ms) {
    const s = ms / 1000;
    if (s <= RED_AT_SECONDS) return 'red';
    if (s <= YELLOW_AT_SECONDS) return 'yellow';
    return 'green';
  }

  // Display

  function setDigit(slot, d, animate) {
    const old = slot.lastElementChild;
    const next = document.createElement('span');
    next.className = 'digit';
    next.textContent = d;
    slot.appendChild(next);
    if (!old) return;
    if (!animate || reduceMotion) { old.remove(); return; }
    const opts = { duration: 320, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards' };
    next.animate([{ transform: 'translateY(-100%)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], opts);
    const out = old.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(100%)', opacity: 0 }], opts);
    out.onfinish = () => old.remove();
  }

  function render(ms, quiet = false) {
    const total = Math.ceil(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    const digits = [Math.floor(m / 10), m % 10, Math.floor(s / 10), s % 10];
    const first = shownDigits.length === 0;
    digits.forEach((d, i) => {
      if (shownDigits[i] === d) return;
      if (i === 0 && d === 0) return;  // the leading slot collapses instead of rolling to 0
      setDigit(slots[i], d, !first);
    });
    slots[0].classList.toggle('off', digits[0] === 0);
    shownDigits = digits;

    fill.style.setProperty('--p', Math.max(0, Math.min(1, 1 - ms / barTotalMs)).toFixed(4));

    const color = colorFor(ms);
    if (color !== shownColor) {
      const crossed = !quiet && shownColor !== null && phase === 'running';
      shownColor = color;
      body.dataset.color = color;
      if (crossed) { pulse(); ding(); }
    }
  }

  function pulse() {
    if (reduceMotion) return;
    flash.animate(
      [{ opacity: 0 }, { opacity: 0.35, offset: 0.15 }, { opacity: 0 }],
      { duration: 800, easing: 'ease-out' },
    );
    clock.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.06)', offset: 0.3 }, { transform: 'scale(1)' }],
      { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' },
    );
  }

  function bounce() {
    if (reduceMotion) return;
    clock.animate(
      [{ transform: 'scale(0.96)' }, { transform: 'scale(1)' }],
      { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1.2)' },
    );
  }

  function setPhase(next) {
    phase = next;
    body.dataset.phase = next;
    hint.textContent = HINTS[next];
  }

  // State machine

  function tick() {
    if (phase !== 'running') return;
    const ms = remaining();
    render(ms);
    if (ms <= 0) { finish(); return; }
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    unlockAudio();
    endAt = now() + remainingMs;
    setPhase('running');
    body.classList.remove('fresh');
    bounce();
    requestWakeLock();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function pause() {
    remainingMs = remaining();
    cancelAnimationFrame(rafId);
    setPhase('paused');
    bounce();
    releaseWakeLock();
    render(remainingMs);
  }

  function finish() {
    cancelAnimationFrame(rafId);
    remainingMs = 0;
    setPhase('done');
    render(0);
    chime();
    releaseWakeLock();
  }

  function reset() {
    cancelAnimationFrame(rafId);
    remainingMs = TOTAL_SECONDS * 1000;
    barTotalMs = TOTAL_SECONDS * 1000;
    setPhase('idle');
    body.classList.add('fresh');
    releaseWakeLock();
    render(remainingMs);
  }

  function toggle() {
    if (phase === 'running') pause();
    else if (phase === 'done') reset();
    else start();
  }

  // Time picker (two-finger tap, N or Right arrow)

  const MAX_TIME_MS = (99 * 60 + 59) * 1000;

  function formatTime(sec) {
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }

  // "7:30" or "7.30" -> 7:30; "730" / "1000" -> 7:30 / 10:00; "7" -> 7:00.
  function parseTime(text) {
    const t = text.trim();
    let m = /^(\d{1,3})[:.](\d{1,2})$/.exec(t);
    if (m) return (Number(m[1]) * 60 + Number(m[2])) * 1000;
    m = /^(\d{1,4})$/.exec(t);
    if (!m) return null;
    if (t.length <= 2) return Number(t) * 60 * 1000;
    return (Number(t.slice(0, -2)) * 60 + Number(t.slice(-2))) * 1000;
  }

  function pickerOpen() {
    return picker.classList.contains('open');
  }

  function openPicker(focusInput) {
    pickerError.textContent = '';
    pickerInput.value = '';
    picker.classList.add('open');
    if (focusInput) pickerInput.focus();
  }

  function closePicker() {
    pickerInput.blur();
    picker.classList.remove('open');
  }

  function applyTime(ms) {
    ms = Math.max(1000, Math.min(MAX_TIME_MS, ms));
    if (phase === 'running') endAt = now() + ms;
    else remainingMs = ms;
    if (phase === 'done') setPhase('idle');
    barTotalMs = Math.max(TOTAL_SECONDS * 1000, ms);
    body.classList.remove('fresh');
    closePicker();
    render(remaining(), true);  // a jump, not a crossing: no ding
  }

  [TOTAL_SECONDS, YELLOW_AT_SECONDS + PRESET_MARGIN_SECONDS, RED_AT_SECONDS + PRESET_MARGIN_SECONDS, PRESET_MARGIN_SECONDS]
    .filter((sec, i, all) => sec > 0 && all.indexOf(sec) === i)
    .forEach((sec) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = formatTime(sec);
      b.addEventListener('click', () => applyTime(sec * 1000));
      presets.appendChild(b);
    });

  pickerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const ms = parseTime(pickerInput.value);
    if (ms === null || ms <= 0) {
      pickerError.textContent = 'Use m:ss like 7:30, digits like 730, or minutes like 7.';
      return;
    }
    applyTime(ms);
  });
  document.getElementById('pickerCancel').addEventListener('click', closePicker);
  picker.addEventListener('click', (e) => { if (e.target === picker) closePicker(); });

  // Sound. Two tones are rendered once into WAVs and played through one
  // <audio> element: a soft ding at each color change and a longer chime at
  // 0:00. iOS lets a media element that a tap started be replayed later
  // without a gesture, and media playback ignores silent mode, which Web
  // Audio output does not.

  const CHIME_NOTES = [523.25, 659.25, 783.99, 1046.5];  // C5 E5 G5 C6
  const CHIME_LEAD_S = 0.25;  // silence before the first note, so the unlock play+pause stays inaudible
  const DING = { freq: 880, at: 0, dur: 0.9, gain: 0.3 };  // A5, half the chime's level
  let bell = null;
  let chimeUrl = null;
  let dingUrl = null;
  let bellReady = false;

  // notes: [{ freq, at, dur, gain }], seconds after the lead-in silence.
  function renderTone(notes, leadS) {
    const rate = 22050;
    const end = Math.max(...notes.map((x) => x.at + x.dur)) + 0.2;
    const n = Math.ceil((leadS + end) * rate);
    const samples = new Float32Array(n);
    notes.forEach(({ freq, at, dur, gain }) => {
      const s0 = Math.floor((leadS + at) * rate);
      const s1 = Math.min(n, Math.floor((leadS + at + dur) * rate));
      for (let s = s0; s < s1; s++) {
        const t = (s - s0) / rate;
        const attack = Math.min(1, t / 0.02);
        const decay = Math.pow(0.0002, t / dur);
        samples[s] += gain * attack * decay * Math.sin(2 * Math.PI * freq * t);
      }
    });
    const view = new DataView(new ArrayBuffer(44 + n * 2));
    const tag = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    tag(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); tag(8, 'WAVE');
    tag(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    tag(36, 'data'); view.setUint32(40, n * 2, true);
    for (let s = 0; s < n; s++) view.setInt16(44 + s * 2, Math.max(-1, Math.min(1, samples[s])) * 32767, true);
    return URL.createObjectURL(new Blob([view.buffer], { type: 'audio/wav' }));
  }

  function getBell() {
    if (!bell) {
      const last = CHIME_NOTES.length - 1;
      chimeUrl = renderTone(
        CHIME_NOTES.map((freq, i) => ({ freq, at: i * 0.28, dur: i === last ? 1.8 : 0.7, gain: 0.6 })),
        CHIME_LEAD_S,
      );
      dingUrl = renderTone([DING], 0.05);
      bell = new Audio(chimeUrl);
      bell.preload = 'auto';
      bell.setAttribute('playsinline', '');
      bell.load();
    }
    return bell;
  }

  // Runs inside the start tap: starts the element during the gesture and stops
  // it again inside the leading silence. From then on play() works any time.
  function unlockAudio() {
    const el = getBell();
    if (bellReady) return;
    const started = el.play();
    if (!started) return;
    started.then(() => {
      el.pause();
      el.currentTime = 0;
      bellReady = true;
    }).catch(() => {});
  }

  function playTone(url) {
    const el = getBell();
    // Re-setting src before play() is the workaround for WebKit bug 295518:
    // home-screen apps on iOS 26.0/26.1 otherwise go silent after a relaunch.
    el.src = url;
    el.play().catch(() => {});
  }

  function chime() { playTone(chimeUrl); }
  function ding() { playTone(dingUrl); }

  // Keep the screen on while running

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (phase !== 'running') { lock.release().catch(() => {}); return; }
      wakeLock = lock;
      lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
    } catch (_) {
      wakeLock = null;
    }
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || phase !== 'running') return;
    if (!wakeLock) requestWakeLock();
    render(remaining());
  });

  // Input: one finger toggles, two fingers skip.
  // Touch goes through touch events: iOS Safari drops pointer events once a
  // second finger lands, so a two-finger tap never completed through them.

  const TAP_MAX_MS = 800;
  const TAP_MAX_MOVE_PX = 24;

  let touchFingers = 0;
  let touchStart = 0;
  let touchMoved = false;
  let touchIgnored = false;
  const touchOrigins = new Map();

  window.addEventListener('touchstart', (e) => {
    if (touchFingers === 0) {
      touchStart = now();
      touchMoved = false;
      touchIgnored = !!e.target.closest('#reset, #picker');
      touchOrigins.clear();
    }
    if (touchIgnored) return;
    e.preventDefault();
    for (const t of e.changedTouches) touchOrigins.set(t.identifier, { x: t.clientX, y: t.clientY });
    touchFingers = Math.max(touchFingers, e.touches.length);
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (touchIgnored) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const o = touchOrigins.get(t.identifier);
      if (o && Math.hypot(t.clientX - o.x, t.clientY - o.y) > TAP_MAX_MOVE_PX) touchMoved = true;
    }
  }, { passive: false });

  function endTouch(e, cancelled) {
    if (touchIgnored) {
      if (e.touches.length === 0) touchIgnored = false;
      return;
    }
    e.preventDefault();
    if (cancelled) touchMoved = true;
    if (e.touches.length > 0) return;
    const fingers = touchFingers;
    touchFingers = 0;
    if (touchMoved || now() - touchStart > TAP_MAX_MS) return;
    if (fingers >= 2) openPicker(false);
    else toggle();
  }

  window.addEventListener('touchend', (e) => endTouch(e, false), { passive: false });
  window.addEventListener('touchcancel', (e) => endTouch(e, true), { passive: false });

  // Mouse and pen go through pointer events.

  const pointers = new Map();
  let gestureFingers = 0;
  let gestureStart = 0;
  let gestureMoved = false;

  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' || e.target.closest('#reset, #picker')) return;
    if (pointers.size === 0) {
      gestureFingers = 0;
      gestureStart = now();
      gestureMoved = false;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    gestureFingers = Math.max(gestureFingers, pointers.size);
  });

  window.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (p && Math.hypot(e.clientX - p.x, e.clientY - p.y) > TAP_MAX_MOVE_PX) gestureMoved = true;
  });

  function endGesture(e, cancelled) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (cancelled) gestureMoved = true;
    if (pointers.size > 0) return;
    if (gestureMoved || now() - gestureStart > TAP_MAX_MS) return;
    if (gestureFingers >= 2) openPicker(false);
    else toggle();
  }

  window.addEventListener('pointerup', (e) => endGesture(e, false));
  window.addEventListener('pointercancel', (e) => endGesture(e, true));

  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    resetBtn.blur();
    reset();
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (pickerOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); closePicker(); }
      return;  // the form handles typing and Enter
    }
    const k = e.key.toLowerCase();
    if (k === 'arrowright' || k === 'n') { e.preventDefault(); openPicker(true); }
    else if (k === ' ' || k === 'enter') { e.preventDefault(); toggle(); }
    else if (k === 'r') reset();
  });

  // No pinch zoom, no long-press menu.
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // iOS 17+: put the page on the media channel so silent mode does not mute it.
  if (navigator.audioSession) {
    try { navigator.audioSession.type = 'playback'; } catch (_) { /* older WebKit */ }
  }
  getBell();
  render(remainingMs);
})();
</script>
</body>
</html>
